ip vrf blue
 rd 1:1
 route-target both 1:1
ip vrf red
 rd 2:2
 route-target both 2:2
mpls ldp router-id Loopback0 force
interface FastEthernet1/0
 ip vrf forwarding blue
 ip address 10.10.1.1 255.255.255.0
 no shutdown
interface FastEthernet1/1
 ip vrf forwarding red
 ip address 11.11.1.1 255.255.255.0
 no shutdown
interface FastEthernet0/0
 ip address 222.222.1.1 255.255.255.0
 mpls ip
 no shutdown
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
router ospf 1
 network 222.222.1.0 0.0.0.255 area 0
 network 1.1.1.1 0.0.0.0 area 0
ip route vrf blue 192.168.101.0 255.255.255.0 10.10.1.100
ip route vrf red 192.168.111.0 255.255.255.0 11.11.1.100
router bgp 100
 neighbor 2.2.2.2 remote-as 100
 neighbor 2.2.2.2 update-source Loopback0
 address-family vpnv4
  neighbor 2.2.2.2 activate
  neighbor 2.2.2.2 send-community extended
 exit-address-family
 address-family ipv4 vrf blue
  redistribute static
 exit-address-family
 address-family ipv4 vrf red
  redistribute static
