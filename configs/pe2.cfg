ip vrf blue
 rd 1:1
 route-target both 1:1
ip vrf red
 rd 2:2
 route-target both 2:2
mpls ldp router-id Loopback0 force
interface FastEthernet1/0
 ip vrf forwarding blue
 ip address 10.10.2.1 255.255.255.0
 no shutdown
interface FastEthernet1/1
 ip vrf forwarding red
 ip address 11.11.2.1 255.255.255.0
 no shutdown
interface FastEthernet0/0
 ip address 222.222.2.10 255.255.255.0
 mpls ip
 no shutdown
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
router ospf 1
 network 222.222.2.0 0.0.0.255 area 0
 network 2.2.2.2 0.0.0.0 area 0
ip route vrf blue 192.168.102.0 255.255.255.0 10.10.2.100
ip route vrf red 192.168.112.0 255.255.255.0 11.11.2.100
router bgp 100
 neighbor 1.1.1.1 remote-as 100
 neighbor 1.1.1.1 update-source Loopback0
 address-family vpnv4
  neighbor 1.1.1.1 activate
  neighbor 1.1.1.1 send-community extended
 exit-address-family
 address-family ipv4 vrf blue
  redistribute static
 exit-address-family
 address-family ipv4 vrf red
  redistribute static
